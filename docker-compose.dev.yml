services:
  db:
    image: postgres:17
    container_name: postgres_dev

    environment:
      POSTGRES_DB: makok
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
